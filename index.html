<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pics/logo/sclogo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Content Security Policy для разрешения загрузки ресурсов -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://res.cloudinary.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src 'self' https: wss:; media-src 'self' blob: https:;">
    
    <!-- DNS prefetch и preconnect для оптимизации -->
    <link rel="dns-prefetch" href="//gist.githubusercontent.com">
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="dns-prefetch" href="//fonts.gstatic.com">
    <link rel="dns-prefetch" href="//res.cloudinary.com">
    
    <link rel="preconnect" href="https://gist.githubusercontent.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://res.cloudinary.com">
    
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@400;600;700&family=Open+Sans:wght@400;600&family=Poppins:wght@400;500;600&family=Raleway:wght@400;500;600&family=Roboto:wght@400;500;700&family=Source+Sans+Pro:wght@400;600&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    
    <title>SoulCycle</title>

    <!-- Применяем сохранённую тему до первой отрисовки, чтобы не было белой вспышки в тёмной теме -->
    <script>
      (function () {
        var theme = 'light';
        try { theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'; } catch (e) {}
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;
        root.style.backgroundColor = theme === 'dark' ? '#1e1e1e' : '#fff';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
